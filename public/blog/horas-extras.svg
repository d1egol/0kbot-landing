<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Reducir horas extras con automatización">
  <rect width="1200" height="630" fill="#EFF6FF"/>
  <!-- Subtle dot grid -->
  <g fill="#1E40AF" opacity="0.06">
    <circle cx="80" cy="80" r="3"/><circle cx="1120" cy="80" r="3"/>
    <circle cx="80" cy="550" r="3"/><circle cx="1120" cy="550" r="3"/>
  </g>
  <!-- Clock face + downward arrow (recovered time) -->
  <g transform="translate(540 315)">
    <!-- Clock outer ring -->
    <circle r="190" fill="#FFFFFF" stroke="#1E40AF" stroke-width="12"/>
    <!-- Hour markers (12, 3, 6, 9) -->
    <rect x="-7" y="-185" width="14" height="24" fill="#1E40AF"/>
    <rect x="-7" y="161" width="14" height="24" fill="#1E40AF"/>
    <rect x="161" y="-7" width="24" height="14" fill="#1E40AF"/>
    <rect x="-185" y="-7" width="24" height="14" fill="#1E40AF"/>
    <!-- Minor markers (1,2,4,5,7,8,10,11) - small dots -->
    <g fill="#93C5FD">
      <circle cx="92" cy="-160" r="6"/><circle cx="160" cy="-92" r="6"/>
      <circle cx="160" cy="92" r="6"/><circle cx="92" cy="160" r="6"/>
      <circle cx="-92" cy="160" r="6"/><circle cx="-160" cy="92" r="6"/>
      <circle cx="-160" cy="-92" r="6"/><circle cx="-92" cy="-160" r="6"/>
    </g>
    <!-- Hour hand pointing to 5 (late afternoon = quitting time recovered) -->
    <line x1="0" y1="0" x2="70" y2="95" stroke="#1E40AF" stroke-width="14" stroke-linecap="round"/>
    <!-- Minute hand pointing to 12 -->
    <line x1="0" y1="0" x2="0" y2="-130" stroke="#1E40AF" stroke-width="9" stroke-linecap="round"/>
    <!-- Center pivot -->
    <circle r="14" fill="#1E40AF"/>
  </g>
  <!-- Downward arrow (right side): "tiempo devuelto" -->
  <g transform="translate(870 315)">
    <line x1="0" y1="-110" x2="0" y2="90" stroke="#93C5FD" stroke-width="18" stroke-linecap="round"/>
    <polyline points="-40,50 0,110 40,50" fill="none" stroke="#93C5FD" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
