<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Automatización de WhatsApp para pymes">
  <rect width="1200" height="630" fill="#EFF6FF"/>
  <!-- Subtle dot grid background -->
  <g fill="#1E40AF" opacity="0.06">
    <circle cx="80" cy="80" r="3"/><circle cx="180" cy="80" r="3"/><circle cx="1120" cy="80" r="3"/>
    <circle cx="80" cy="550" r="3"/><circle cx="1120" cy="550" r="3"/><circle cx="1020" cy="550" r="3"/>
  </g>
  <!-- Left bubble: incoming message (navy filled, with 3 dots) -->
  <rect x="220" y="160" width="400" height="180" rx="40" fill="#1E40AF"/>
  <path d="M 240 340 L 220 380 L 290 335 Z" fill="#1E40AF"/>
  <circle cx="330" cy="250" r="22" fill="#93C5FD"/>
  <circle cx="410" cy="250" r="22" fill="#93C5FD"/>
  <circle cx="490" cy="250" r="22" fill="#93C5FD"/>
  <!-- Right bubble: automated reply (white outline + lightning bolt) -->
  <rect x="580" y="290" width="400" height="200" rx="40" fill="#FFFFFF" stroke="#1E40AF" stroke-width="6"/>
  <path d="M 960 490 L 1000 510 L 950 440 Z" fill="#FFFFFF"/>
  <line x1="960" y1="490" x2="1000" y2="510" stroke="#1E40AF" stroke-width="6" stroke-linecap="round"/>
  <line x1="1000" y1="510" x2="950" y2="440" stroke="#1E40AF" stroke-width="6" stroke-linecap="round"/>
  <!-- Lightning bolt inside right bubble (automation symbol) -->
  <path d="M 790 320 L 705 420 L 775 420 L 745 470 L 850 365 L 795 365 Z" fill="#1E40AF"/>
</svg>
