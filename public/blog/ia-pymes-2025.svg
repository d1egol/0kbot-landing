<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="IA para pymes — introducción 2026">
  <rect width="1200" height="630" fill="#EFF6FF"/>
  <!-- Subtle dot grid -->
  <g fill="#1E40AF" opacity="0.06">
    <circle cx="80" cy="80" r="3"/><circle cx="1120" cy="80" r="3"/>
    <circle cx="80" cy="550" r="3"/><circle cx="1120" cy="550" r="3"/>
  </g>
  <!-- Neural network: 3 layers connected, output sparkle -->
  <g transform="translate(600 315)">
    <!-- Connections layer 1 -> 2 -->
    <g stroke="#93C5FD" stroke-width="3" stroke-linecap="round">
      <line x1="-250" y1="-100" x2="-50" y2="-130"/>
      <line x1="-250" y1="-100" x2="-50" y2="0"/>
      <line x1="-250" y1="-100" x2="-50" y2="130"/>
      <line x1="-250" y1="100" x2="-50" y2="-130"/>
      <line x1="-250" y1="100" x2="-50" y2="0"/>
      <line x1="-250" y1="100" x2="-50" y2="130"/>
    </g>
    <!-- Connections layer 2 -> 3 (output) -->
    <g stroke="#93C5FD" stroke-width="4" stroke-linecap="round">
      <line x1="-50" y1="-130" x2="200" y2="0"/>
      <line x1="-50" y1="0" x2="200" y2="0"/>
      <line x1="-50" y1="130" x2="200" y2="0"/>
    </g>
    <!-- Nodes layer 1 -->
    <circle cx="-250" cy="-100" r="38" fill="#1E40AF"/>
    <circle cx="-250" cy="100" r="38" fill="#1E40AF"/>
    <!-- Nodes layer 2 -->
    <circle cx="-50" cy="-130" r="32" fill="#1E40AF"/>
    <circle cx="-50" cy="0" r="32" fill="#1E40AF"/>
    <circle cx="-50" cy="130" r="32" fill="#1E40AF"/>
    <!-- Output node bigger -->
    <circle cx="200" cy="0" r="56" fill="#1E40AF"/>
    <!-- Sparkle on output -->
    <g transform="translate(290 -80)">
      <path d="M 0 -38 L 10 -10 L 38 0 L 10 10 L 0 38 L -10 10 L -38 0 L -10 -10 Z" fill="#1E40AF"/>
      <circle r="6" fill="#93C5FD"/>
    </g>
  </g>
</svg>
